name: Rust Info
description: Rust and Bash details
runs:
  using: composite
  steps:
    - run: |
        rustup show
        cargo --version
        rustup +nightly show
        cargo +nightly --version
        cargo spellcheck --version
        bash --version
        substrate-contracts-node --version

        # ink v5 needs cargo-contract v5; master targets ink v6.
        cargo install --git https://github.com/use-ink/cargo-contract --locked --rev b9630e7447a1a062768652d2a679c46578b3b8b6 --force
        cargo-contract --version
      shell: bash
